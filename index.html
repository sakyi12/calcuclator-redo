<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stack Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #e5e7eb;
    font-family: Arial, sans-serif;
}

.calculator {
    width: 350px;
    padding: 22px;
    background: #17365d;
    border-radius: 18px;
    color: white;
    box-shadow: 0 8px 25px #0003;
}

h2 {
    text-align: center;
    font-size: 23px;
    margin: 0 0 18px;
}

#display {
    width: 100%;
    height: 75px;
    padding: 12px;
    margin-bottom: 15px;
    background: #dbeafe;
    color: #111827;
    border: none;
    border-radius: 8px;
    text-align: right;
    font-size: 32px;
    font-weight: bold;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

button {
    height: 55px;
    border: none;
    border-radius: 7px;
    background: #f8fafc;
    color: #111827;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #bfdbfe;
}

.operator {
    background: #fbbf24;
}

.action {
    background: #86efac;
    font-size: 15px;
}

.clear {
    background: #f87171;
}

#history {
    background: #0f2745;
    padding: 10px;
    margin-top: 15px;
    border-radius: 7px;
    min-height: 45px;
    max-height: 100px;
    overflow-y: auto;
    font-size: 13px;
}

.info {
    font-size: 13px;
    margin-top: 10px;
    color: #dbeafe;
}
</style>
</head>

<body>
<div class="calculator">
    <h2>STACK CALCULATOR</h2>

    <input id="display" value="0" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearAll()">AC</button>
        <button onclick="undo()">Undo</button>
        <button onclick="redo()">Redo</button>
        <button class="operator" onclick="choose('/')">÷</button>

        <button onclick="number('7')">7</button>
        <button onclick="number('8')">8</button>
        <button onclick="number('9')">9</button>
        <button class="operator" onclick="choose('*')">×</button>

        <button onclick="number('4')">4</button>
        <button onclick="number('5')">5</button>
        <button onclick="number('6')">6</button>
        <button class="operator" onclick="choose('-')">−</button>

        <button onclick="number('1')">1</button>
        <button onclick="number('2')">2</button>
        <button onclick="number('3')">3</button>
        <button class="operator" onclick="choose('+')">+</button>

        <button onclick="number('0')">0</button>
        <button onclick="number('.')">.</button>
        <button onclick="backspace()">⌫</button>
        <button class="operator" onclick="calculate()">=</button>
    </div>

    <div id="history">Your calculations will appear here.</div>
    <div class="info" id="stackInfo">Undo stack: 0 states</div>
    <div class="info">LIFO: Last In, First Out</div>
</div>

<script>
const display = document.getElementById("display");
const historyBox = document.getElementById("history");
const stackInfo = document.getElementById("stackInfo");

let undoStack = [];
let redoStack = [];
let firstNumber = null;
let operator = null;
let startNewNumber = true;
let history = [];

function saveState() {
    undoStack.push({
        display: display.value,
        firstNumber,
        operator,
        startNewNumber,
        history: [...history]
    });

    if (undoStack.length > 50) undoStack.shift();

    redoStack = [];
    updateInfo();
}

function restoreState(state) {
    display.value = state.display;
    firstNumber = state.firstNumber;
    operator = state.operator;
    startNewNumber = state.startNewNumber;
    history = [...state.history];
    showHistory();
    updateInfo();
}

function updateInfo() {
    stackInfo.textContent =
        "Undo stack: " + undoStack.length + " states";
}

function showHistory() {
    historyBox.innerHTML = "";

    if (history.length === 0) {
        historyBox.textContent = "Your calculations will appear here.";
        return;
    }

    history.slice(-5).forEach(item => {
        const line = document.createElement("div");
        line.textContent = item;
        historyBox.appendChild(line);
    });
}

function number(value) {
    saveState();

    if (value === "." &&
        !startNewNumber &&
        display.value.includes(".")) {
        undoStack.pop();
        updateInfo();
        return;
    }

    if (startNewNumber) {
        display.value = value === "." ? "0." : value;
        startNewNumber = false;
    } else {
        display.value += value;
    }
}

function choose(op) {
    saveState();
    firstNumber = Number(display.value);
    operator = op;
    startNewNumber = true;
}

function calculate() {
    if (operator === null || startNewNumber) return;

    saveState();

    const secondNumber = Number(display.value);
    let result;

    switch (operator) {
        case "+": result = firstNumber + secondNumber; break;
        case "-": result = firstNumber - secondNumber; break;
        case "*": result = firstNumber * secondNumber; break;
        case "/":
            if (secondNumber === 0) {
                display.value = "Cannot divide by zero";
                operator = null;
                startNewNumber = true;
                return;
            }
            result = firstNumber / secondNumber;
            break;
    }

    result = Number(result.toPrecision(12));

    history.push(
        firstNumber + " " + operator + " " +
        secondNumber + " = " + result
    );

    display.value = String(result);
    firstNumber = null;
    operator = null;
    startNewNumber = true;
    showHistory();
}

function undo() {
    if (undoStack.length === 0) return;

    redoStack.push({
        display: display.value,
        firstNumber,
        operator,
        startNewNumber,
        history: [...history]
    });

    restoreState(undoStack.pop());
}

function redo() {
    if (redoStack.length === 0) return;

    undoStack.push({
        display: display.value,
        firstNumber,
        operator,
        startNewNumber,
        history: [...history]
    });

    restoreState(redoStack.pop());
}

function backspace() {
    if (startNewNumber) return;

    saveState();
    display.value = display.value.slice(0, -1) || "0";
    if (display.value === "0") startNewNumber = true;
}

function clearAll() {
    saveState();
    display.value = "0";
    firstNumber = null;
    operator = null;
    startNewNumber = true;
    history = [];
    showHistory();
}
</script>
</body>
</html>
